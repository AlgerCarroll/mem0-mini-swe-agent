name: CLI Node CI

# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cli/node/**'
      - '.github/workflows/cli-node-ci.yml'
  workflow_call:


jobs:
  lint:
    name: Lint and typecheck (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: cli/node
        run: pnpm lint

      - name: Run TypeScript typecheck
        working-directory: cli/node
        run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: cli/node
        run: pnpm test

  build:
    name: Build and verify CLI entry (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: cli/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli/node
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        working-directory: cli/node
        run: pnpm build

      - name: Verify CLI JavaScript entry file
        working-directory: cli/node
        run: |
          if [ ! -f dist/index.js ]; then
            echo "::error::Expected CLI entry file 'dist/index.js' was not generated by the build."
            exit 1
          fi
          echo "CLI entry file 'dist/index.js' is present."
