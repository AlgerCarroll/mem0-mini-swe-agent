name: openclaw checks

# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/openclaw/**'
      - '.github/workflows/openclaw-checks.yml'
  workflow_call:


jobs:
  lint:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: integrations/openclaw/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: integrations/openclaw
        run: pnpm install --frozen-lockfile
      - name: Run TypeScript type check
        working-directory: integrations/openclaw
        run: pnpm exec tsc --noEmit

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: integrations/openclaw/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: integrations/openclaw
        run: pnpm install --frozen-lockfile
      - name: Run Vitest with coverage
        working-directory: integrations/openclaw
        run: pnpm exec vitest run --coverage --coverage.reporter=lcov
      - name: Upload coverage to Codecov
        if: success() && matrix.node-version == '20'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: integrations/openclaw/coverage/lcov.info
          flags: openclaw
          fail_ci_if_error: true

  build:
    name: Build and verify entry files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: integrations/openclaw/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: integrations/openclaw
        run: pnpm install --frozen-lockfile
      - name: Build package
        working-directory: integrations/openclaw
        run: pnpm run build
      - name: Verify build entry files
        working-directory: integrations/openclaw
        run: |
          missing=0
          for file in dist/index.js dist/index.d.ts; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Expected build output is missing: $file"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Build did not produce both the JavaScript entry point and TypeScript declarations." >&2
            exit 1
          fi
